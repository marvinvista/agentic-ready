name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
      - run: python -m agentic_ready tests/fixtures/ready --fail-under ready
        env:
          PYTHONPATH: src
      - run: python -m agentic_ready tests/fixtures/not-ready --json
        env:
          PYTHONPATH: src
      - run: python scripts/verify-public-surface
